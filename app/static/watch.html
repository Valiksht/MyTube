<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Плеер</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <h1 id="title">Плеер</h1>
    <video id="player" controls playsinline preload="metadata"></video>
    <p id="description"></p>
    <p class="meta" id="meta"></p>
    <p><a id="channel-link" href="/channel">Канал</a></p>
    <button id="like-button" type="button">Лайк</button>
    <button id="hide-button" type="button" hidden>Скрыть</button>
    <section>
      <h2>Комментарии</h2>
      <form id="comment-form">
        <label for="comment-body">Комментарий</label>
        <textarea id="comment-body" maxlength="2000" required></textarea>
        <button type="submit">Отправить</button>
      </form>
      <div id="comments" class="comments"></div>
    </section>
    <p id="status" role="status"></p>
  </main>
  <script src="/static/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const videoId = params.get("id");
    const status = document.querySelector("#status");
    const player = document.querySelector("#player");
    let liked = false;

    function streamUrl(id) {
      const accessToken = MyTube.token();
      const query = accessToken ? `?access_token=${encodeURIComponent(accessToken)}` : "";
      return `/videos/${id}/stream${query}`;
    }

    async function loadComments() {
      const page = await MyTube.api(`/videos/${videoId}/comments`);
      const host = document.querySelector("#comments");
      if (!page.items.length) {
        host.innerHTML = "<p>Комментариев пока нет.</p>";
        return;
      }
      host.innerHTML = page.items.map((comment) => `<article class="comment"><p>${MyTube.escapeHtml(comment.body)}</p><p class="meta">${MyTube.escapeHtml(new Date(comment.created_at).toLocaleString("ru-RU"))}</p></article>`).join("");
    }

    async function loadVideo() {
      if (!videoId) {
        status.textContent = "Не указано видео";
        return;
      }
      try {
        const video = await MyTube.api(`/videos/${videoId}`);
        document.querySelector("#title").textContent = video.title;
        document.title = video.title;
        document.querySelector("#description").textContent = video.description;
        document.querySelector("#meta").textContent = `${video.like_count} лайков`;
        document.querySelector("#channel-link").href = `/channel?id=${encodeURIComponent(video.channel_id)}`;
        player.src = streamUrl(videoId);
        await loadComments();
        const me = MyTube.token() ? await MyTube.api("/auth/me") : null;
        if (me && (me.role === "moderator" || me.role === "admin")) {
          const hideButton = document.querySelector("#hide-button");
          hideButton.hidden = false;
          hideButton.addEventListener("click", async () => {
            await MyTube.api(`/videos/${videoId}/moderation`, {
              method: "PATCH",
              json: { is_hidden: true },
            });
            location.href = "/";
          });
        }
        status.textContent = "";
      } catch (error) {
        status.textContent = error.message;
      }
    }

    document.querySelector("#like-button").addEventListener("click", async () => {
      if (!MyTube.token()) {
        location.href = "/login";
        return;
      }
      try {
        const state = liked
          ? await MyTube.api(`/videos/${videoId}/likes`, { method: "DELETE" })
          : await MyTube.api(`/videos/${videoId}/likes`, { method: "PUT" });
        liked = state.liked;
        document.querySelector("#like-button").textContent = liked ? "Убрать лайк" : "Лайк";
        document.querySelector("#meta").textContent = `${state.like_count} лайков`;
      } catch (error) {
        status.textContent = error.message;
      }
    });

    document.querySelector("#comment-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!MyTube.token()) {
        location.href = "/login";
        return;
      }
      try {
        await MyTube.api(`/videos/${videoId}/comments`, {
          method: "POST",
          json: { body: document.querySelector("#comment-body").value },
        });
        document.querySelector("#comment-body").value = "";
        await loadComments();
      } catch (error) {
        status.textContent = error.message;
      }
    });

    loadVideo();
  </script>
</body>
</html>
