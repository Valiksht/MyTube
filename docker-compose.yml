name: mytube

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mytube:mytube@postgres:5432/mytube
      DB_ECHO: "false"
      JWT_SECRET_KEY: dev-only-mytube-jwt-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: mytube
      MINIO_SECURE: "false"
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MAX_UPLOAD_BYTES: "2147483648"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mytube
      POSTGRES_PASSWORD: mytube
      POSTGRES_DB: mytube
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mytube -d mytube"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # dockerhub.timeweb.cloud/bitnami/minio:latest больше нет на Docker Hub.
    # Зеркало отдаёт тот же образ Bitnami из bitnamilegacy.
    image: dockerhub.timeweb.cloud/bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER: "on"
      MINIO_SCHEME: http
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_DATA_DIR: /bitnami/minio/data
      MINIO_DEFAULT_BUCKETS: mytube
      MINIO_STARTUP_TIMEOUT: "60"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  minio-init:
    image: dockerhub.timeweb.cloud/bitnamilegacy/minio-client:latest
    environment:
      MINIO_SERVER_HOST: minio
      MINIO_SERVER_PORT_NUMBER: "9000"
      MINIO_SERVER_SCHEME: http
      MINIO_SERVER_ROOT_USER: minioadmin
      MINIO_SERVER_ROOT_PASSWORD: minioadmin
    depends_on:
      minio:
        condition: service_healthy
    command:
      - /opt/bitnami/scripts/minio-client/run.sh
      - mb
      - --ignore-existing
      - minio/mytube
    restart: "no"

volumes:
  postgres_data:
  minio_data:
